[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
asm-core = { path = "crates/asm-core" }
asm-cli = { path = "crates/asm-cli" }
asm-tui = { path = "crates/asm-tui" }
asm-web = { path = "crates/asm-web" }

# tui
ratatui = "0.30"

# web
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rust-embed = "8"
mime_guess = "2"

# core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = { version = "0.2", features = ["serde"] }
etcetera = "0.11"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = "0.10"
libc = "0.2"

# binaries / frontends
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# dev
tempfile = "3"
