name: release

# Tag a version to publish it:
#     git tag v0.1.0 && git push origin v0.1.0
# The workflow builds a binary per platform, attaches them to a GitHub
# Release with checksums, and install.sh downloads from there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build. Leave empty to dry-run the current branch.'
        required: false
      publish:
        description: 'Publish a release (otherwise the binaries are uploaded as artifacts only)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A broken release is worse than a late one, so the tests gate the build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Build the web assets
        # rust-embed compiles these into the binary, so the workspace does
        # not build without them.
        run: bun install --frozen-lockfile && bun run build
        working-directory: crates/asm-web/frontend
      - run: bun test
        working-directory: crates/asm-web/frontend
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings

  build:
    needs: test
    strategy:
      fail-fast: false
      # Only ubuntu-latest and macos-latest are used. ARM Linux runners are
      # not available to every account, and the x86_64 macOS runner image is
      # on its way out, so the two non-native targets are cross-compiled:
      # Apple's toolchain targets both architectures out of the box, and the
      # Linux one needs a cross linker, which apt has.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_linker: aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - name: Build the web assets
        run: bun install --frozen-lockfile && bun run build
        working-directory: crates/asm-web/frontend

      - name: Install the cross linker
        if: matrix.cross_linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.cross_linker }}

      - name: Build
        env:
          # Both the Rust linker and the `cc` crate (which compiles the
          # bundled SQLite) have to be pointed at the cross toolchain.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker && format('{0}-gcc', matrix.cross_linker) || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.cross_linker && format('{0}-gcc', matrix.cross_linker) || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin asm

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="asm-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/asm" "dist/$name/"
          # Ship whatever documentation the tree actually has.
          for extra in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$extra" ] && cp "$extra" "dist/$name/"
          done
          true
          tar -C dist -czf "$name.tar.gz" "$name"
          # shasum is on macOS, sha256sum on Linux.
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
          retention-days: 7

  publish:
    needs: build
    # A dispatch without a tag is a dry run: it proves the matrix builds and
    # leaves the binaries as artifacts, without creating a release.
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and one combined checksum file
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          cd release
          sha256sum *.tar.gz > SHA256SUMS
          ls -la
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Re-running a release should update it, not fail or duplicate it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              release/*
          fi
